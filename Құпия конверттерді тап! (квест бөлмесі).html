<!DOCTYPE html>
<html lang="kk">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Құпия конверттерді тап!</title>
<style>
:root{--bg:#f3efe6;--fg:#1d2433;--card:#fff;--bd:#d6cdb8;--ac:#d97706;--ok:#16a34a;--no:#dc2626;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0f172a;--fg:#e5e7eb;--card:#1e293b;--bd:#334155}}
:root[data-theme="dark"]{--bg:#0f172a;--fg:#e5e7eb;--card:#1e293b;--bd:#334155}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--fg);font-family:system-ui,"Segoe UI",Arial,sans-serif;user-select:none}
header{display:flex;flex-wrap:wrap;gap:10px;align-items:center;justify-content:space-between;padding:10px 16px;background:var(--card);border-bottom:2px solid var(--bd)}
h1{font-size:clamp(16px,2vw,26px);margin:0}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip,button{font:inherit;border:2px solid var(--bd);background:var(--card);color:var(--fg);border-radius:12px;padding:6px 14px;font-size:clamp(14px,1.6vw,22px)}
button{cursor:pointer}button:hover{border-color:var(--ac)}
.chip b{color:var(--ac)}
#start{max-width:760px;margin:6vh auto;padding:28px;background:var(--card);border:2px solid var(--bd);border-radius:20px;text-align:center}
#start h2{font-size:clamp(22px,3vw,38px);margin:0 0 10px}
#start p{font-size:clamp(15px,1.8vw,22px);line-height:1.5}
.teams{display:flex;gap:10px;justify-content:center;flex-wrap:wrap;margin:16px 0}
.teams button.on{background:var(--ac);color:#fff;border-color:var(--ac)}
.go{background:var(--ac);color:#fff;border-color:var(--ac);font-weight:700;padding:12px 28px}
#game{display:none;padding:8px 12px}
svg{display:block;width:100%;max-height:calc(100vh - 110px);margin:0 auto;border:4px solid #5b3a1a;border-radius:12px;background:#222;shape-rendering:crispEdges}
.o{cursor:pointer}.o:hover .s{filter:brightness(1.25)}
.o.done .s{opacity:.55}
.e{animation:b .7s ease-in-out infinite alternate}
@keyframes b{to{transform:translateY(-3px)}}
.shake{animation:sh .35s}
@keyframes sh{25%{transform:translateX(-3px)}75%{transform:translateX(3px)}}
#toast{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:#1d2433;color:#fff;padding:12px 24px;border-radius:14px;font-size:clamp(16px,2vw,26px);opacity:0;transition:opacity .25s;pointer-events:none;max-width:90vw;text-align:center;z-index:60}
#toast.on{opacity:1}
.ov{display:none;position:fixed;inset:0;background:rgba(10,15,30,.75);align-items:center;justify-content:center;padding:16px;z-index:50}
.ov.on{display:flex}
.box{background:var(--card);border:3px solid var(--ac);border-radius:20px;padding:24px;width:min(900px,100%);max-height:92vh;overflow:auto}
.box h3{margin:0 0 6px;color:var(--ac);font-size:clamp(16px,1.8vw,24px)}
#qt{font-size:clamp(20px,2.6vw,36px);font-weight:700;margin:8px 0 16px;line-height:1.3}
.opt{display:block;width:100%;text-align:left;margin:8px 0;padding:14px 18px;font-size:clamp(17px,2.1vw,30px)}
.opt.bad{background:var(--no);color:#fff;border-color:var(--no)}
.opt.good{background:var(--ok);color:#fff;border-color:var(--ok)}
textarea{width:100%;font:inherit;font-size:clamp(17px,2.1vw,28px);padding:12px;border-radius:12px;border:2px solid var(--bd);background:var(--bg);color:var(--fg);user-select:text}
.row{display:flex;justify-content:space-between;gap:10px;margin-top:12px;flex-wrap:wrap}
#msg{font-size:clamp(15px,1.8vw,24px);min-height:1.4em;margin-top:8px}
</style>
</head>
<body>
<header>
<h1>🕵️ Құпия конверттерді тап!</h1>
<div class="chips">
<span class="chip">Топ: <b id="hT">—</b></span>
<span class="chip">Табылды: <b id="hF">0 / 15</b></span>
<span class="chip">Ұпай: <b id="hS">0</b></span>
<span class="chip">⏱ <b id="hC">00:00</b></span>
<button onclick="hint()">💡 Көмек (−3)</button>
<button id="snd" onclick="snd=!snd;this.textContent=snd?'🔊':'🔇'">🔊</button>
</div>
</header>

<div id="start">
<h2>🏫 Құпия сынып бөлмесі</h2>
<p>Бөлмеде <b>15 конверт</b> жасырылған. Заттарды басып, ішін тінтіңдер! Кейбір заттарда ештеңе жоқ. Конверт табылса, сұраққа жауап беріңдер: дұрыс жауап +10 ұпай, қате жауап −2.</p>
<div class="teams" id="teams"></div>
<button class="go" onclick="begin()">🚀 Бастау</button>
</div>

<div id="game"><svg id="room" viewBox="0 0 320 180"></svg></div>
<div id="toast"></div>

<div class="ov" id="qm"><div class="box">
<h3 id="qh"></h3>
<div id="qt"></div>
<div id="qo"></div>
<div id="msg"></div>
<div class="row"><button onclick="closeQ()">✖ Жабу</button><button class="go" id="qb" style="display:none" onclick="checkText()">Жауапты тексеру</button></div>
</div></div>

<div class="ov" id="vm"><div class="box" style="text-align:center">
<div style="font-size:80px">🏆</div>
<h2 style="font-size:clamp(24px,3.5vw,44px);color:var(--ac);margin:0">Тамаша! Барлық 15 конверт табылды!</h2>
<p id="vs" style="font-size:clamp(18px,2.4vw,32px)"></p>
<button class="go" onclick="location.reload()">🔄 Жаңа ойын</button>
</div></div>

<script>
// [name, hint, [x,y,w,h], rects]; first 15 hide envelopes, last 2 are empty decoys
const O=[
['Тақта','Мұғалім осында жазады',[58,12,112,54],[[58,12,112,54,'#8b5a2b'],[62,16,104,46,'#1f6f50'],[70,26,44,2,'#e8f5e9'],[70,34,64,2,'#e8f5e9'],[70,42,30,2,'#e8f5e9']]],
['Сағат','Уақытты көрсетеді',[184,14,24,24],[[184,14,24,24,'#333'],[187,17,18,18,'#f5f5f5'],[195,19,2,8,'#222'],[195,25,6,2,'#c00']]],
['Терезе','Жарық кіретін жер',[228,12,60,56],[[228,12,60,56,'#fff'],[232,16,24,48,'#7ec8ff'],[260,16,24,48,'#7ec8ff'],[236,24,12,4,'#fff'],[264,36,14,4,'#fff']]],
['Постер','Қабырғада ілулі түсті сурет',[12,12,34,40],[[12,12,34,40,'#f2c14e'],[16,16,26,32,'#e76f51'],[22,24,14,14,'#264653']]],
['Кітап сөресі','Кітаптар тұратын жер',[12,58,48,34],[[12,84,48,6,'#8b5a2b'],[16,66,6,18,'#e63946'],[24,70,6,14,'#457b9d'],[32,64,6,20,'#2a9d8f'],[40,68,6,16,'#f4a261'],[48,72,6,12,'#9b5de5']]],
['Мұғалім үстелі','Мұғалімнің жұмыс орны',[206,84,70,40],[[206,84,70,8,'#a0612b'],[210,92,62,32,'#7a4620'],[214,98,24,10,'#5e3515'],[244,98,24,10,'#5e3515']]],
['Компьютер','Экраны бар құрылғы',[218,64,28,20],[[218,64,28,18,'#222'],[221,66,22,13,'#4cc9f0'],[228,82,8,2,'#555']]],
['Глобус','Жер шарының кішкентай үлгісі',[252,70,16,14],[[254,70,12,10,'#3b82f6'],[257,72,5,4,'#22c55e'],[256,80,8,2,'#444'],[258,82,4,2,'#444']]],
['Шкаф','Биік құжат шкафы',[292,56,26,68],[[292,56,26,68,'#64748b'],[296,60,18,28,'#94a3b8'],[296,92,18,28,'#94a3b8'],[303,72,4,4,'#222'],[303,104,4,4,'#222']]],
['Сол жақ парта','Сол жақтағы оқушы партасы',[40,116,52,34],[[40,116,52,6,'#d9a05b'],[44,122,4,22,'#555'],[84,122,4,22,'#555'],[50,132,30,8,'#1e3a8a']]],
['Ортаңғы парта','Ортадағы оқушы партасы',[122,124,52,34],[[122,124,52,6,'#d9a05b'],[126,130,4,22,'#555'],[166,130,4,22,'#555'],[132,140,30,8,'#1e3a8a']]],
['Гүл','Құмырадағы жасыл өсімдік',[176,84,20,34],[[178,102,16,16,'#c1440e'],[182,92,8,10,'#16a34a'],[176,86,6,8,'#22c55e'],[188,84,8,10,'#22c55e']]],
['Рюкзак','Оқулық салатын зат',[12,126,24,26],[[12,130,22,22,'#e11d48'],[16,138,14,8,'#9f1239'],[16,126,14,6,'#e11d48']]],
['Қоқыс шелегі','Қағаз тастайтын шелек',[188,134,16,20],[[188,134,16,20,'#6b7280'],[186,132,20,3,'#9ca3af']]],
['Шам','Төбеден жарық береді',[110,0,24,14],[[120,0,4,6,'#333'],[110,6,24,8,'#fde047']]],
['Кілем','',[100,154,84,20],[[100,154,84,20,'#7c3aed'],[104,158,76,12,'#a78bfa']]],
['Өрт сөндіргіш','',[2,94,10,26],[[2,98,10,22,'#dc2626'],[4,94,6,4,'#222']]]
];
// each question: correct answer FIRST (options are shuffled when shown)
const Q=[
['Компьютерде сурет салуға арналған бағдарламалар қалай аталады?',['Графикалық редакторлар','Мәтіндік редакторлар','Музыка ойнатқыштар','Электрондық кестелер']],
['Растрлық графиканың ең кішкентай түсті нүктесі қалай аталады?',['Пиксель','Вектор','Формула','Сызық']],
['Векторлық сурет үлкейгенде неге сапасы бұзылмайды?',['Ол формулалар мен сызықтарға негізделген','Ол өте үлкен пиксельдерден тұрады','Ол видео форматында сақталады','Ол әрқашан өте үлкен өлшемде болады']],
['Графикалық редакторда соңғы әрекетті кері қайтару пернелері?',['Ctrl + Z','Ctrl + C','Ctrl + V','Alt + F4']],
['RGB түс моделіндегі үш негізгі түс қандай?',['Қызыл, жасыл, көк','Сары, қара, ақ','Күлгін, сұр, қызғылт','Көк, сары, қызыл']],
['Paint-те тұйық аймақты бірден бояйтын құрал қалай аталады?',['Құю (бөшке)','Өшіргіш','Қарындаш','Тіктөртбұрыш']],
['Жасанды интеллект (ЖИ) дегеніміз не?',['Ойлауға үйретілген компьютерлік жүйе','Қарапайым калькулятор','Компьютер тышқаны','Экран тазалайтын сұйықтық']],
['Мәтін арқылы сурет салатын ЖИ бағдарламаларына мысал келтір.',['Midjourney, DALL-E, Шедеврум','MS Word, Excel','Paint, Калькулятор','Chrome, Opera']],
['ЖИ-ге сурет салу үшін берілетін мәтіндік тапсырма қалай аталады?',['Промпт','Код','Сайт','Сілтеме']],
['Төмендегілердің қайсысы сурет форматы?',['.jpg / .png','.mp3','.txt','.docx']],
['ЖИ адам денесін салғанда қандай қате жиі жібереді?',['Саусақтарды артық немесе қисық салады','Киім салмайды','Аяқты мүлде салмайды','Тек қара-ақ салады']],
['Суреттің анықтығын сипаттайтын пиксель тығыздығы қалай аталады?',['Ажыратымдылық','Жылдамдық','Дыбыстылық','Салмақ']],
['Адам мен ЖИ-дің сурет салудағы басты айырмашылығы неде?',['ЖИ жылдам жасайды, ал адам сезім мен уақыт жұмсайды','ЖИ қолмен сызады, ал адам тек пернетақтаны қолданады','Адам суретті секундына мың рет жасай алады','Екеуінің арасында ешқандай айырмашылық жоқ']],
['Paint-те тұп-тура шеңбер немесе шаршы сызу үшін қай перне басылады?',['Shift','Space','Enter','Ctrl']],
['«Болашақтың мектебі» тақырыбына ЖИ үшін кемінде 4 сөзден тұратын промпт жазыңдар!',null]
];
let snd=true,team='Pixel Team',score=0,sec=0,cur=null,tm,ac;
const found=new Set(),shown=new Set(),$=id=>document.getElementById(id);
const TEAMS=['🟨 Pixel Team','🟥 Vector Masters','🟩 Prompt Creators'];
TEAMS.forEach((t,i)=>{const b=document.createElement('button');b.textContent=t;if(!i)b.className='on';b.onclick=()=>{team=t.slice(3);[...$('teams').children].forEach(x=>x.className='');b.className='on';beep(400)};$('teams').appendChild(b)});
function beep(f,d=.12){if(!snd)return;try{ac=ac||new(window.AudioContext||window.webkitAudioContext)();const o=ac.createOscillator(),g=ac.createGain();o.frequency.value=f;o.type='triangle';g.gain.value=.15;o.connect(g);g.connect(ac.destination);o.start();o.stop(ac.currentTime+d)}catch(e){}}
function toast(t,ms=2200){const e=$('toast');e.textContent=t;e.className='on';clearTimeout(tm);tm=setTimeout(()=>e.className='',ms)}
const R=(x,y,w,h,c)=>`<rect x="${x}" y="${y}" width="${w}" height="${h}" fill="${c}"/>`;
function draw(){
let s=R(0,0,320,108,'#e6d8b8')+R(0,104,320,4,'#7a4b25')+R(0,108,320,72,'#b9854c');
for(let y=120;y<180;y+=12)s+=R(0,y,320,1,'#a5733c');
s+=R(0,0,320,2,'#cbb98e');
[15,16,...Array(15).keys()].forEach(i=>{const[n,h,b,r]=O[i];
s+=`<g class="o" id="o${i}" onclick="clickObj(${i})"><title>${n}</title><g class="s">${r.map(a=>R(...a)).join('')}</g>${R(...b).replace('/>',' fill-opacity="0"/>')}<g id="m${i}"></g></g>`});
$('room').innerHTML=s}
function mark(i){const b=O[i][2],x=b[0]+b[2]/2-8,y=Math.max(1,b[1]-12),m=$('m'+i);
m.innerHTML=found.has(i)?`<text x="${x+3}" y="${y+10}" font-size="12" fill="#16a34a" font-weight="700">✓</text>`:
`<g transform="translate(${x},${y})"><g class="e"><rect width="16" height="11" fill="#fde68a" stroke="#7a4b00" stroke-width="1"/><path d="M0 0L8 6L16 0" fill="none" stroke="#7a4b00" stroke-width="1"/><rect x="6" y="5" width="4" height="4" fill="#dc2626"/></g></g>`}
function clickObj(i){
if(i>14){$('o'+i).classList.add('done');beep(200);return toast('Бұл жерде ештеңе жоқ 🤷')}
if(found.has(i))return toast('Бұл конверт бұрын табылған ✓');
if(!shown.has(i)){shown.add(i);mark(i);beep(660);toast('✉️ Конверт табылды!',1300);setTimeout(()=>openQ(i),700)}else openQ(i)}
function shuffle(a){for(let i=a.length-1;i>0;i--){const j=Math.random()*(i+1)|0;[a[i],a[j]]=[a[j],a[i]]}return a}
function openQ(i){cur=i;const[q,a]=Q[i];$('qh').textContent=`✉️ №${i+1} конверт · ${O[i][0]}`;$('qt').textContent=q;$('msg').textContent='';const c=$('qo');c.innerHTML='';
$('qb').style.display=a?'none':'';
if(a){shuffle(a.map((t,k)=>[t,k===0])).forEach(([t,ok],k)=>{const b=document.createElement('button');b.className='opt';b.textContent=String.fromCharCode(65+k)+'. '+t;b.onclick=()=>pick(b,ok);c.appendChild(b)})}
else c.innerHTML='<textarea id="ta" rows="3" placeholder="Мысалы: футуристік мектеп, неон жарық, 3D сурет"></textarea>';
$('qm').classList.add('on')}
function closeQ(){$('qm').classList.remove('on')}
function pick(b,ok){if(ok){b.classList.add('good');$('msg').textContent='✅ Дұрыс! +10 ұпай';win(cur)}else{b.classList.add('bad','shake');b.disabled=true;beep(180,.3);add(-2);$('msg').textContent='❌ Қате, −2 ұпай. Тағы байқап көр!'}}
function checkText(){const n=($('ta').value.trim().split(/\s+/).filter(Boolean)).length;if(n<4){beep(180,.3);$('msg').textContent='Промпт кемінде 4 сөзден тұруы керек. Қазір: '+n;return}$('msg').textContent='✅ Керемет промпт! +10 ұпай';win(cur)}
function win(i){beep(784,.3);add(10);found.add(i);mark(i);$('o'+i).classList.add('done');$('hF').textContent=found.size+' / 15';
document.querySelectorAll('.opt').forEach(b=>b.disabled=true);$('qb').style.display='none';
setTimeout(()=>{closeQ();if(found.size===15)victory()},1300)}
function add(n){score=Math.max(0,score+n);$('hS').textContent=score}
function hint(){const l=[...Array(15).keys()].filter(i=>!found.has(i));if(!l.length)return;const i=l[Math.random()*l.length|0];add(-3);beep(500);toast('💡 '+O[i][1]+'...',6000)}
function begin(){beep(500);$('start').style.display='none';$('game').style.display='block';$('hT').textContent=team;draw();
setInterval(()=>{sec++;$('hC').textContent=String(sec/60|0).padStart(2,'0')+':'+String(sec%60).padStart(2,'0')},1000)}
function victory(){$('vs').textContent=`Топ: ${team} · Ұпай: ${score} · Уақыт: ${$('hC').textContent}`;$('vm').classList.add('on');[523,659,784,1046].forEach((f,k)=>setTimeout(()=>beep(f,.25),k*180))}
</script>
</body>
</html>
